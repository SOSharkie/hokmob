<div class="team-form-container">
  <div class="team-form-header">
    <span>Team Form</span>
  </div>
  <!-- One grid for both teams, so each home game shares its row with the away game beside it -->
  <div class="previous-games-container">
    <div class="home-games">
      @for (game of homeTeamGames; track game; let index = $index; let isLast = $last) {
        <app-previous-game
            [style.grid-row]="index + 1"
            [game]="game"
            [teamId]="homeTeamId"
            [isLast]="isLast"
        ></app-previous-game>
      }
      @if (!homeTeamGames?.length) {
        <div class="no-games">No recent games</div>
      }
    </div>
    <div class="away-games">
      @for (game of awayTeamGames; track game; let index = $index; let isLast = $last) {
        <app-previous-game
            [style.grid-row]="index + 1"
            [game]="game"
            [teamId]="awayTeamId"
            [isLast]="isLast"
        ></app-previous-game>
      }
      @if (!awayTeamGames?.length) {
        <div class="no-games">No recent games</div>
      }
    </div>
  </div>
</div>
