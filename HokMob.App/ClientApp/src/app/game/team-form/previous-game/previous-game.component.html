<div *ngIf="game" class="previous-game-container" [ngClass]="{'last-previous-game': isLast}" [routerLink]="['/game', game.id]">
  <div class="home-team">
    <span class="home team-name">{{homeTeamShortName}}</span>
    <div class="logo-container">
      <app-team-logo [teamId]="homeTeamId" [size]="logoSize" [width]="logoMaxWidth"></app-team-logo>
    </div>
  </div>
  <div class="score-column">
    <div class="score-container" [ngClass]="scoreColor">
      <span>{{score}}</span>
    </div>
    <span *ngIf="gameTypeLabel" class="game-type-label">{{gameTypeLabel}}</span>
  </div>
  <div class="away-team">
    <div class="logo-container">
      <app-team-logo [teamId]="awayTeamId" [size]="logoSize" [width]="logoMaxWidth"></app-team-logo>
    </div>
    <span class="away team-name">{{awayTeamShortName}}</span>
  </div>
</div>
