<div class="game-top-players-container">
  <div class="game-top-players-header">
    <span>{{cardTitle}}</span>
    <!-- Switches the rink between the best rated players and each team's stars -->
    <button type="button" class="lineup-toggle" [class.showing-stars]="showStarLineup"
            [attr.aria-pressed]="showStarLineup" [title]="showStarLineup ? 'Show the best rated players' : 'Show the star players'"
            (click)="toggleStarLineup()">
      <mat-icon class="toggle-icon">star</mat-icon>
      <span>Stars</span>
    </button>
  </div>
  <div class="rink">
    <!-- Drawn in feet on a 200.13ft long rink, home end on the left -->
    <div class="rink-surface" aria-hidden="true">
      <!-- The viewBox is as long as the rink is drawn, so the markings scale evenly and the circles stay circles.
           preserveAspectRatio="none" only takes up the rounding the rink's 2px border leaves. -->
      <svg *ngFor="let drawing of rinkDrawings" class="rink-markings" [class.standing]="drawing.standing"
           [attr.viewBox]="drawing.viewBox" preserveAspectRatio="none">
        <g class="thin">
          <line *ngFor="let x of drawing.goalLineXs" [attr.x1]="x" y1="0" [attr.x2]="x" [attr.y2]="drawing.width"/>
          <path *ngFor="let crease of drawing.creasePaths" class="crease" [attr.d]="crease"/>
          <rect *ngFor="let x of drawing.goalXs" [attr.x]="x" [attr.y]="drawing.goalY" width="3.3" height="6" rx="1.2"/>
          <path [attr.d]="drawing.refereeCreasePath"/>
          <ng-container *ngFor="let circle of drawing.faceoffCircles">
            <circle [attr.cx]="circle.x" [attr.cy]="circle.y" [attr.r]="drawing.circleRadius"/>
            <path [attr.d]="circle.hashMarks"/>
          </ng-container>
          <circle [attr.cx]="drawing.centerX" [attr.cy]="drawing.middle" [attr.r]="drawing.circleRadius"/>
        </g>
        <g class="dots">
          <circle *ngFor="let circle of drawing.faceoffCircles" [attr.cx]="circle.x" [attr.cy]="circle.y" r="1"/>
          <circle [attr.cx]="drawing.centerX" [attr.cy]="drawing.middle" r="0.6"/>
        </g>
        <line class="blue-line" *ngFor="let x of drawing.blueLineXs" [attr.x1]="x" y1="0" [attr.x2]="x"
              [attr.y2]="drawing.width"/>
        <line class="center-line" [attr.x1]="drawing.centerX" y1="0" [attr.x2]="drawing.centerX"
              [attr.y2]="drawing.width"/>
      </svg>
    </div>
    <div class="team-players home-players">
      <ng-container *ngTemplateOutlet="playerSpots; context: {$implicit: homeSpots}"></ng-container>
    </div>
    <div class="team-players away-players">
      <ng-container *ngTemplateOutlet="playerSpots; context: {$implicit: awaySpots}"></ng-container>
    </div>
  </div>
  <!-- Opened, each bench slides out along the boards and shows its next best rated players above the coach -->
  <div *ngIf="showBenches" class="benches" [class.expanded]="showBenchPlayers">
    <div class="bench home-bench">
      <ng-container *ngTemplateOutlet="benchPlayers; context: {$implicit: homeBenchPlayers}"></ng-container>
      <div class="coach">
        <app-team-logo *ngIf="homeTeamLogo" class="team-logo" [src]="homeTeamLogo" [size]="logoSize"></app-team-logo>
        <div class="coach-info">
          <span class="coach-name">{{homeCoach || '-'}}</span>
          <span class="coach-label">Head Coach</span>
        </div>
      </div>
    </div>
    <button *ngIf="hasBenchPlayers" type="button" class="bench-toggle" [attr.aria-expanded]="showBenchPlayers"
            [title]="showBenchPlayers ? 'Hide the bench players' : 'Show the bench players'" (click)="toggleBenchPlayers()">
      <mat-icon class="toggle-icon">expand_more</mat-icon>
    </button>
    <div class="bench away-bench">
      <ng-container *ngTemplateOutlet="benchPlayers; context: {$implicit: awayBenchPlayers}"></ng-container>
      <div class="coach">
        <app-team-logo *ngIf="awayTeamLogo" class="team-logo" [src]="awayTeamLogo" [size]="logoSize"></app-team-logo>
        <div class="coach-info">
          <span class="coach-name">{{awayCoach || '-'}}</span>
          <span class="coach-label">Head Coach</span>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #benchPlayers let-players>
  <div class="bench-players" [attr.aria-hidden]="!showBenchPlayers">
    <div *ngFor="let player of players; let index = index; trackBy: trackByPlayer" (click)="clickPlayer(player)"
         class="bench-player" [class.highlighted]="isHighlighted(player)" [style.--index]="index"
         [style.--highlight-color]="isHighlighted(player) ? getHighlightColor(player) : null">
      <ng-container *ngTemplateOutlet="playerAvatar; context: {$implicit: player}"></ng-container>
      <div class="player-name">
        <span>{{player.name}}</span>
      </div>
    </div>
  </div>
</ng-template>

<ng-template #playerSpots let-spots>
  <div *ngFor="let spot of spots; trackBy: trackBySpot" (click)="clickPlayer(spot.player)" class="top-player"
       [ngClass]="spot.line" [class.highlighted]="isHighlighted(spot.player)"
       [style.--highlight-color]="isHighlighted(spot.player) ? getHighlightColor(spot.player) : null" [style.--length.%]="spot.length" [style.--across.%]="spot.across">
    <ng-container *ngTemplateOutlet="playerAvatar; context: {$implicit: spot.player}"></ng-container>
    <div class="player-name">
      <span>{{spot.player.name}}</span>
    </div>
  </div>
</ng-template>

<ng-template #playerAvatar let-player>
  <div class="player-avatar">
    <div class="player-headshot-container">
      <img [src]="player.headshot" (error)="showBlankHeadshot($event)" alt="" class="player-headshot">
    </div>
    <div class="hokmob-score-container" [ngStyle]="{'background-color': getHokmobScoreColor(player)}">
      <span>{{player.hokmobRating}}</span>
      <mat-icon *ngIf="player.playerId === gameMvpPlayerId" class="star-icon">star</mat-icon>
    </div>
    <div *ngIf="player.skaterStats?.goals > 0" class="player-goals">
      <div *ngFor="let puckIndex of getGoalPuckIndexes(player)" class="player-goal-container"
           [class.highlighted-goal]="isHighlightedGoal(player, puckIndex)">
        <img class="puck-icon" src="assets/puck.png" alt="">
      </div>
    </div>
    <div *ngIf="player.goalieStats" class="goalie-icon-container">
      <img class="goalie-icon" src="assets/goalie_mask.png" alt="">
    </div>
  </div>
</ng-template>
