<div class="player-game-dialog-container">
  <button type="button" class="dialog-ratings-button" title="See how this rating adds up"
          aria-label="See how this rating adds up" (click)="openRatingsPage()">
    <mat-icon fontIcon="science"></mat-icon>
  </button>
  <button type="button" class="dialog-close-button" aria-label="Close" (click)="closeDialog()">
    <mat-icon fontIcon="close"></mat-icon>
  </button>
  <div class="player-dialog-body" [class.with-shot-map]="playerShots.length > 0">
    <app-player-game-stats [player]="player"></app-player-game-stats>
    <app-player-shot-map *ngIf="playerShots.length > 0" [shots]="playerShots" [isGoalie]="isGoalie"></app-player-shot-map>
  </div>
  <footer class="player-footer-container">
    <button type="button" class="profile-container" (click)="clickPlayerProfile()">
      <img *ngIf="profileHeadshot; else profileIcon" [src]="profileHeadshot" (error)="headshotFailed = true" alt=""
           class="profile-headshot">
      <ng-template #profileIcon>
        <mat-icon>person</mat-icon>
      </ng-template>
      <span class="profile-label">Player Profile</span>
    </button>
    <button type="button" class="done-button" (click)="closeDialog()">
      <span>Done</span>
    </button>
  </footer>
</div>
