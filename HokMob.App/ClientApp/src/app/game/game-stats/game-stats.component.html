<div class="game-stats-container">
  <div class="game-stats-header">
    <span>Game Stats</span>
  </div>
  <div class="all-stats-container">
    <div class="shots-container">
      <div class="shots-header">
        <span>Shots</span>
      </div>
      <div class="shot-chart-logo-container">
        @if (homeTeamLogo) {
          <div class="team-shots">
            <img [src]="homeTeamLogo" alt="" class="team-logo">
          </div>
        }
        <div class="chart-container">
          <canvas #shotChart></canvas>
        </div>
        @if (awayTeamLogo) {
          <div class="team-shots">
            <img [src]="awayTeamLogo" alt="" class="team-logo">
          </div>
        }
      </div>
      <div class="shot-labels">
        <span class="shot-number">{{homeShots}}</span>
        <span class="shot-number">{{awayShots}}</span>
      </div>
    </div>
    <div class="team-stats-container">
      @for (row of statRows; track row) {
        <div class="team-stats-row">
          <span class="home team-stat" [attr.title]="row.description ?? null"
                [ngStyle]="{'background-color': row.homeBetter ? homeColor : '', 'color': row.homeBetter ? homeTextColor : ''}">
            {{row.homeValue}}
          </span>
          <span class="stats-label" [attr.title]="row.description ?? null">{{row.label}}</span>
          <span class="away team-stat" [attr.title]="row.description ?? null"
                [ngStyle]="{'background-color': row.awayBetter ? awayColor : '', 'color': row.awayBetter ? awayTextColor : ''}">
            {{row.awayValue}}
          </span>
        </div>
      }
      @if (advancedStatsSourceUrl) {
        <a class="stats-source" [href]="advancedStatsSourceUrl" target="_blank"
           rel="noopener">{{advancedStatsSourceLabel}}</a>
      }
    </div>
  </div>
</div>
