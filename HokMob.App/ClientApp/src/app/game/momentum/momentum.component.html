<div class="momentum-container">
  <div class="chart-title">
    <span>Momentum</span>
  </div>
  <div class="view-toggle" role="group" aria-label="Chart view">
    <button
        type="button"
        class="view-button"
        [class.selected]="chartView === 'line'"
        [attr.aria-pressed]="chartView === 'line'"
        aria-label="Line chart"
        title="Line chart"
        (click)="setChartView('line')"
    >
      <!-- Lucide "chart-spline" -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
        <path d="M7 16c.5-2 1.5-7 4-7 2 0 2 3 4.5 3 2.5 0 4.5-5 5-7"/>
      </svg>
    </button>
    <button
        type="button"
        class="view-button"
        [class.selected]="chartView === 'bar'"
        [attr.aria-pressed]="chartView === 'bar'"
        aria-label="Bar chart"
        title="Bar chart"
        (click)="setChartView('bar')"
    >
      <!-- Lucide "chart-column" -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3v16a2 2 0 0 0 2 2h16"/>
        <path d="M18 17V9"/>
        <path d="M13 17V5"/>
        <path d="M8 17v-3"/>
      </svg>
    </button>
  </div>
  <div class="chart-container">
    <canvas #momentumChart></canvas>
    <div
        *ngIf="hoveredGoals.length > 0"
        class="goal-tooltip"
        [style.left.px]="tooltipPosition.left"
        [style.top.px]="tooltipPosition.top"
        [style.bottom.px]="tooltipPosition.bottom"
        [style.width.px]="tooltipPosition.width"
    >
      <div *ngFor="let goal of hoveredGoals; trackBy: trackGoal" class="goal">
        <div class="goal-header">
          <img [src]="getTeamLogo(goal)" alt="" class="team-logo">
          <span class="goal-time">{{hoveredPeriodLabel}} · {{getGoalTime(goal)}}</span>
        </div>
        <div class="goal-scorer">
          <span class="color-green">{{getScorerName(goal)}}</span>
          <span class="score-update">
            (<span [class.color-green]="isHomeGoal(goal)">{{goal.details?.homeScore}}</span>
            - <span [class.color-green]="!isHomeGoal(goal)">{{goal.details?.awayScore}}</span>)
          </span>
        </div>
        <div class="goal-assists">{{getAssistsLabel(goal)}}</div>
      </div>
    </div>
  </div>
</div>
