<div class="series-container" [ngClass]="{'smaller-version': smallerVersion, 'undecided-series': !hasBothTeams}" (click)="openSeriesDialog()">
  <div class="series-header">
    <app-team-logo class="team-logo" [src]="logoA" [size]="logoSize"
                   [ngClass]="{'placeholder-logo': !isLogoALoaded, 'loser': teamALost}"></app-team-logo>
    <span *ngIf="!smallerVersion" class="next-game">{{nextGameDay}}</span>
    <app-team-logo class="team-logo" [src]="logoB" [size]="logoSize"
                   [ngClass]="{'placeholder-logo': !isLogoBLoaded, 'loser': teamBLost}"></app-team-logo>
  </div>
  <div class="series-info">
    <div class="team-names">
      <div>
        <span class="team-abbr" [ngClass]="{'loser': teamALost}">{{teamAName}}</span>
        <span class="team-rank">{{teamARank}}</span>
      </div>
      <span class="team-spacer"></span>
      <div>
        <span class="team-abbr" [ngClass]="{'loser': teamBLost}">{{teamBName}}</span>
        <span class="team-rank">{{teamBRank}}</span>
      </div>
    </div>
    <div class="series-score">
      <span [ngClass]="{'loser': teamALost}">{{teamAWins}}</span>
      <span class="score-spacer">-</span>
      <span [ngClass]="{'loser': teamBLost}">{{teamBWins}}</span>
    </div>
  </div>
</div>
