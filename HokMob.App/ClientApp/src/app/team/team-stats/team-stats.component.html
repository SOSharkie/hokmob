@if (loading) {
  <app-skeleton-card shape="bar" [layout]="skeletonLayout"></app-skeleton-card>
} @else if (team) {
  <section class="rating-bar-card team-stats" [class.embedded]="embedded">
    <div class="rating-bar-card-header">
      @if (showTeam) {
        <img class="rating-bar-card-logo" [src]="teamLogo" alt="">
      }
      <h2 class="rating-bar-card-title">{{title}}</h2>
      <span class="rating-bar-card-short-title" aria-hidden="true">{{shortTitle}}</span>
      <ng-content select="[cardAction]"></ng-content>
    </div>
    @for (group of groups; track group.title) {
      <div class="rating-group">
        <h3 class="rating-group-title">{{group.title}}</h3>
        <ul class="rating-parts">
          @for (row of group.rows; track row.label) {
            <li class="rating-part">
              <div class="part-label">
                <span class="part-name">{{row.label}}</span>
                <span class="part-short-name" aria-hidden="true">{{row.shortLabel}}</span>
              </div>
              <span class="part-value">{{row.value}}</span>
              <span class="part-rank" [ngClass]="'rank-' + row.rankTier" [class.no-rank]="!row.rank">{{row.rank}}</span>
              <div class="part-bar" aria-hidden="true">
                <span class="part-bar-fill" [ngClass]="'rank-' + row.rankTier"
                      [style.left.%]="row.barStart" [style.width.%]="row.barWidth"></span>
              </div>
            </li>
          }
        </ul>
      </div>
    }
  </section>
}
