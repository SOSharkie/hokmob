<div class="team-stats-tab">
  <div class="stats-cards">
    <div class="stats-column">
      @if (hasRating || ratingLoading) {
        <app-team-power-rating
            [teamId]="teamId"
            [ratings]="ratings"
            [timeline]="timeline"
            [loading]="ratingLoading"
        ></app-team-power-rating>
      }
      <app-team-stats
          [teamId]="teamId"
          [teamStats]="teamStats"
          [loading]="teamStatsLoading"
      ></app-team-stats>
    </div>
    <div class="stats-column">
      @if (hasRating || ratingLoading) {
        <app-team-advanced-stats
            [teamId]="teamId"
            [ratings]="ratings"
            [loading]="ratingLoading"
        ></app-team-advanced-stats>
      }
      @if (hasError) {
        <div class="team-stats-tab-card team-stats-tab-message">
          <span>The power rating and advanced stats couldn't be loaded</span>
        </div>
      }
    </div>
  </div>
  @if (ratingLoading) {
    <app-skeleton-card
        shape="block"
        cardTitle="Power Rating Over the Season"
        [layout]="chartSkeletonLayout"
        [mobileLayout]="chartSkeletonMobileLayout"
    ></app-skeleton-card>
  } @else if (hasRating) {
    <app-team-rating-chart
        title="Power Rating Over the Season"
        [games]="games"
        [teamIds]="teamIds"
    ></app-team-rating-chart>
  }
</div>
