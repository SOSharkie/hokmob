<!-- Switches the card between the power rating and the season stats, in the header's top right corner -->
<ng-template #viewToggle>
  @if (canToggle) {
    <app-team-rating-view-toggle [view]="shownView" (viewChange)="selectView($event)"></app-team-rating-view-toggle>
  }
</ng-template>

@if (shownView === 'power') {
  <app-team-power-rating
      [teamId]="teamId"
      [ratings]="ratings"
      [timeline]="timeline"
      [loading]="ratingLoading"
  >
    <ng-container ngProjectAs="[cardAction]" [ngTemplateOutlet]="viewToggle"></ng-container>
  </app-team-power-rating>
} @else {
  <app-team-stats
      [teamId]="teamId"
      [teamStats]="teamStats"
      [loading]="statsLoading"
  >
    <ng-container ngProjectAs="[cardAction]" [ngTemplateOutlet]="viewToggle"></ng-container>
  </app-team-stats>
}
