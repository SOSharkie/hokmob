<div class="team-form-container">
  <div class="team-form-header">
    <span>Team Form</span>
  </div>
  <div class="previous-games-container">
    <div class="prev-games">
      <div *ngFor="let game of games; let isLast = last">
        <app-previous-game
            [teamId]="teamId"
            [game]="game"
            [isLast]="isLast"
        ></app-previous-game>
      </div>
      <div *ngIf="!games?.length" class="no-games">No recent games</div>
    </div>
  </div>
</div>
