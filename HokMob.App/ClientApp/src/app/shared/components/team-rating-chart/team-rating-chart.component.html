<section class="rating-chart-card">
  <div class="rating-chart-header">
    <h2 class="rating-chart-title">{{title}}</h2>
  </div>
  <div class="rating-chart-controls">
    <div class="line-toggles" role="group" [attr.aria-label]="isMultiTeam ? 'Stat' : 'Lines'">
      @for (line of lines; track line.id) {
        <button type="button" class="line-toggle"
                [class.selected]="isSelected(line)"
                [disabled]="isDisabled(line)"
                [attr.aria-pressed]="isSelected(line)"
                [title]="getLineTitle(line)"
                (click)="toggleLine(line)">
          <span class="line-swatch" aria-hidden="true" [style.background-color]="isMultiTeam ? null : line.color"></span>
          <span>{{line.label}}</span>
        </button>
      }
    </div>
    <div class="window-toggle" role="group" aria-label="Games">
      @for (option of windowOptions; track option.value) {
        <button type="button" class="toggle-option"
                [class.selected]="window === option.value" [attr.aria-pressed]="window === option.value"
                (click)="selectWindow(option.value)">{{option.label}}</button>
      }
    </div>
  </div>
  <div class="chart-container" [class.empty]="!hasPoints">
    <canvas #ratingChart role="img" [attr.aria-label]="chartLabel"></canvas>
    @if (!hasPoints) {
      <div class="chart-message">The chart starts after 3 games</div>
    }
  </div>
  <p class="chart-note">5.0 is league average. Hover or tap a game for its ranks.</p>
</section>
