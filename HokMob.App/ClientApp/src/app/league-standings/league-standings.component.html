<div class="league-standings-container">
  <div class="standings-card">
    <div class="standings-filters-container">
      <button *ngFor="let filter of filters"
              type="button"
              (click)="updateStandingsType(filter.type)"
              class="standings-type-filter"
              [ngClass]="{'selected-filter': currentStandingsType === filter.type}">
        {{filter.label}}
      </button>
    </div>
    <div *ngIf="standings" class="main-standings">
      <app-standings
          class="embedded"
          [standings]="standings"
          [showFormAndNext]="true"
          [defaultStandingsType]="currentStandingsType"
      ></app-standings>
    </div>
  </div>
</div>
