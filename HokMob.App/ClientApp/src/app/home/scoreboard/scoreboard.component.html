<div class="scores-container" [ngClass]="'enter-' + dayTransition">
  <div class="day-select-container">
    <button type="button" class="day-shift left" aria-label="Previous day" (click)="shiftDateLeft()">
      <mat-icon svgIcon="lucide:chevron-left"></mat-icon>
    </button>
    <div class="date-container">
      <div class="date-select-container" role="button" tabindex="0" aria-haspopup="dialog"
           [attr.aria-label]="'Pick a day, ' + displayDayLabel"
           (click)="onClickDate()" (keydown.enter)="onClickDate()"
           (keydown.space)="$event.preventDefault(); onClickDate()">
        <span class="selected-day">{{displayDayLabel}}</span>
        <input matInput [(ngModel)]="selectedDay" (dateChange)="onDateSelect($event)" [matDatepicker]="datePicker"
               class="date-input" tabindex="-1" aria-hidden="true">
        <mat-icon fontIcon="arrow_drop_down" class="dropdown-arrow"></mat-icon>
      </div>
      <mat-datepicker #datePicker></mat-datepicker>
    </div>
    <button type="button" class="day-shift right" aria-label="Next day" (click)="shiftDateRight()">
      <mat-icon svgIcon="lucide:chevron-right"></mat-icon>
    </button>
  </div>
  <div *ngFor="let game of currentDayGames; let last = last" class="games-container" [ngClass]="{'last-scorecard': last}">
    <app-scorecard
      [game]="game"
    ></app-scorecard>
  </div>
  <div *ngIf="isLoading" class="loading-container">
    <app-loading-spinner [size]="40" class="loading-spinner"></app-loading-spinner>
  </div>
  <div *ngIf="!isLoading && currentDayGames && currentDayGames.length === 0" class="no-games-container">
    <span>No Games</span>
  </div>
</div>
