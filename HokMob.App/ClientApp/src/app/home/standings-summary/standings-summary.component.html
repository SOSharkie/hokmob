<div class="standings-summary-container">
  <a class="standings-title" [routerLink]="['/standings']">
    <span>NHL Standings</span>
    <mat-icon class="title-chevron" svgIcon="lucide:chevron-right" aria-hidden="true"></mat-icon>
  </a>
  <div *ngIf="standings" class="mini-standings">
    <app-standings
        [standings]="standings"
        [showFormAndNext]="false"
        [miniStandings]="true"
        [defaultStandingsType]="standingsType"
    ></app-standings>
  </div>
</div>
