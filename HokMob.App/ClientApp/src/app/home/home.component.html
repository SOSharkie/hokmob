<div class="home-page">
  <div class="nav-menu">
    <app-navigation-menu></app-navigation-menu>
  </div>
  <div class="scores">
    <app-scores
        [selectedDayString]="selectedDayString"
        (selectedDayChange)="onSelectedDayChange($event)"
    ></app-scores>
  </div>
  <div class="news-and-standings">
    @if (isPlayoffs === true) {
      <app-playoff-summary></app-playoff-summary>
    }
    @if (isPlayoffs === false) {
      <app-standings-summary></app-standings-summary>
    }
  </div>
</div>
