<div class="playoff-summary-container">
  <a class="playoffs-title" [routerLink]="['/playoffs']">
    <span>{{playoffsTitle}}</span>
    <mat-icon class="title-chevron" svgIcon="lucide:chevron-right" aria-hidden="true"></mat-icon>
  </a>
  <div class="series-summaries-container">
    <div *ngFor="let series of currentSeries" class="series-summary">
      <app-playoff-series
          [seriesData]="series"
          [season]="playoffsData.seasonId"
          [smallerVersion]="true"
      ></app-playoff-series>
    </div>
  </div>
</div>
